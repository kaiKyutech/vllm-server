[project]
name = "vllm-server"
version = "0.1.0"
description = "Config-driven vLLM serving for batch experiments on NVIDIA Ampere GPUs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vllm==0.19.1",
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "torchvision==0.25.0",
  "transformers==5.5.3",
  "pyyaml>=6,<7",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.36,<2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
